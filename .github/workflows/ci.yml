name: CI

# 全套测试跑在离线 Mock Provider 上 —— 不需要任何 API Key, 完全确定性, CI 成本为零。
# 这是 Provider 抽象带来的直接收益: 换成真模型的话, 断言结果会取决于当天模型的心情,
# CI 就只能沦为摆设。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: pytest -q

  smoke:
    name: HTTP / SSE 端到端冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 启动服务
        run: |
          python -m uvicorn keel.server.app:app --host 127.0.0.1 --port 8000 &
          # 轮询直到健康检查通过, 而不是 sleep 一个拍脑袋的秒数 ——
          # 固定 sleep 在 CI 上要么白等要么偶发失败, 是 flaky 的经典来源
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "服务 30 秒内未就绪"; exit 1

      # 不在标题里写死项数: 公网模式下实验触发那几项会合并成一条, 数字会漂
      - name: 冒烟测试
        run: python scripts/smoke_api.py

  demo:
    name: 场景演示可运行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # demo 没有断言, 但它串起了全部五个场景 —— 只要有一处抛异常就会退出非零。
      # 这是最便宜的一层烟雾报警。
      - name: 跑通全部场景
        run: python scripts/demo.py all

  web:
    name: 前端类型检查与产物一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # build 脚本里串了 tsc --noEmit, 所以类型错误会在这一步直接失败
      - name: 类型检查并构建
        working-directory: web
        run: npm run build

      # 产物是提交进版本库的(为了让 clone 下来不装 Node 也能跑), 代价就是它可能落后于源码。
      # 这一步重建一遍再比对: 改了 web/ 却忘了提交产物, 在这里就会被拦住, 而不是等到
      # 别人 clone 下来发现界面是旧的。
      - name: 产物必须与源码一致
        run: |
          if [ -n "$(git status --porcelain keel/server/static)" ]; then
            echo "::error::前端产物与源码不一致, 请在 web/ 下执行 npm run build 并提交 keel/server/static"
            git status --porcelain keel/server/static
            exit 1
          fi
          echo "产物与源码一致"
