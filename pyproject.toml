[build-system]
# PEP 639 的 SPDX 写法要 setuptools>=77, 低于此版本会报 license 字段无效
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
description = "可量化 harness 层改动的 Agent 运行时与消融评测链路"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]
accurate-tokens = ["tiktoken>=0.8"]

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.setuptools.package-data]
"keel.server" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --tb=short"
# 没有这行, 裸跑 `pytest` 会 ModuleNotFoundError: No module named 'keel' ——
# prepend 模式只把 tests/ 放进 sys.path, 根目录得靠 `python -m pytest` 顺带加,
# 两种调用方式行为不一致, 而 README 和 CI 用的恰好是裸 pytest。
pythonpath = ["."]
